host: localhost:8405
info:
  contact:
    name: Gearbox Agent Support
    url: https://github.com/sarg3nt/gearbox-agent/issues
  description: REST API for monitoring and managing HAProxy instances. Provides endpoints
    for system metrics, HAProxy stats, log streaming, security monitoring, and real-time
    WebSocket events.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/sarg3nt/gearbox-agent
  title: Gearbox Agent API
  version: "1.0"
paths:
  /api/v1/events:
    get:
      description: 'Upgrades to WebSocket connection for real-time event streaming.
        First obtain a token via POST /api/v1/events/token, then connect with ?token=<token>.
        Events: sync.started, sync.completed, sync.failed, config.changed, webhook.received.'
      parameters:
      - description: Short-lived WebSocket token from /api/v1/events/token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols - WebSocket connection established
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: WebSocket events stream
      tags:
      - WebSocket
  /api/v1/events/info:
    get:
      description: Returns information about the WebSocket endpoint including available
        event types and current subscriber count.
      produces:
      - application/json
      responses:
        "200":
          description: WebSocket endpoint info
          schema:
            $ref: '#/definitions/internal_api.WSInfoResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: WebSocket info
      tags:
      - WebSocket
  /api/v1/events/token:
    post:
      description: Exchanges an API key for a short-lived (60 second) single-use token
        for WebSocket authentication. Use the returned token in the WebSocket connection
        query parameter.
      produces:
      - application/json
      responses:
        "200":
          description: WebSocket token
          schema:
            $ref: '#/definitions/internal_api.WSTokenResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to generate token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Exchange API key for WebSocket token
      tags:
      - WebSocket
  /api/v1/metadata:
    get:
      description: Returns HAProxy configuration metadata including frontends, backends,
        and their settings from the last sync.
      produces:
      - application/json
      responses:
        "200":
          description: HAProxy metadata
          schema:
            $ref: '#/definitions/internal_api.MetadataResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Sync service not configured or pending
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: HAProxy metadata
      tags:
      - Sync
  /api/v1/sync/status:
    get:
      description: Returns the status of the Git sync service including last sync
        time, error status, and backend count.
      produces:
      - application/json
      responses:
        "200":
          description: Sync status
          schema:
            $ref: '#/definitions/internal_api.SyncStatusResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Sync service not configured
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Sync status
      tags:
      - Sync
  /api/v1/traffic:
    get:
      description: Returns traffic analysis data including per-IP statistics from
        stick tables and backend aggregations.
      parameters:
      - default: 100
        description: Limit number of sources returned
        in: query
        name: limit
        type: integer
      - default: 10
        description: Number of top sources to return
        in: query
        name: top_n
        type: integer
      - default: false
        description: Include all IPs, not just those with data
        in: query
        name: include_all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Traffic analysis data
          schema:
            $ref: '#/definitions/internal_gears_traffic.TrafficResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Failed to fetch traffic data
          schema:
            type: string
        "503":
          description: HAProxy stats not configured
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Traffic analysis
      tags:
      - Traffic
  /api/v1/traffic/summary:
    get:
      description: Returns a summary of traffic statistics without individual IP details.
      produces:
      - application/json
      responses:
        "200":
          description: Traffic summary
          schema:
            $ref: '#/definitions/internal_gears_traffic.TrafficSummary'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Failed to fetch traffic data
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Traffic summary
      tags:
      - Traffic
  /api/v1/webhook/github:
    post:
      consumes:
      - application/json
      description: Receives GitHub push events and triggers a sync. Authenticated
        via HMAC-SHA256 signature in X-Hub-Signature-256 header.
      parameters:
      - description: GitHub HMAC signature
        in: header
        name: X-Hub-Signature-256
        required: true
        type: string
      - description: GitHub event type
        in: header
        name: X-GitHub-Event
        required: true
        type: string
      - description: GitHub push payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.GitHubPushPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Webhook processed successfully
          schema:
            $ref: '#/definitions/internal_api.WebhookSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/internal_api.WebhookErrorResponse'
        "401":
          description: Invalid or missing signature
          schema:
            $ref: '#/definitions/internal_api.WebhookErrorResponse'
      summary: GitHub webhook
      tags:
      - Webhook
  /api/v1/webhook/info:
    get:
      description: Returns webhook configuration information including the URL to
        configure in GitHub.
      produces:
      - application/json
      responses:
        "200":
          description: Webhook configuration info
          schema:
            $ref: '#/definitions/internal_api.WebhookInfoResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Webhook info
      tags:
      - Webhook
  /health:
    get:
      description: Returns the health status of the gearbox-agent service. No authentication
        required. Only "status" is exposed; version and uptime are intentionally omitted
        from this unauthenticated endpoint to avoid fingerprinting by remote scanners.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/internal_api.HealthResponse'
      summary: Health check
      tags:
      - Health
schemes:
- https
securityDefinitions:
  BearerAuth:
    description: 'API key authentication. Use format: Bearer YOUR_API_KEY'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
