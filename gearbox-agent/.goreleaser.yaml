# GoReleaser configuration for gearbox-agent
# This is used for local builds and can be integrated with CI later
# Run: goreleaser release --snapshot --clean

version: 2

project_name: gearbox-agent

before:
  hooks:
  - go mod tidy

builds:
- id: gearbox-agent
  binary: gearbox-agent
  main: ./cmd/gearbox-agent
  goos:
  - linux
  goarch:
  - amd64
  - arm64
  env:
  - CGO_ENABLED=0
  ldflags:
  - -s -w
  - -X main.Version={{.Version}}
  - -X main.CommitSHA={{.ShortCommit}}
  - -X main.BuildDate={{.Date}}

archives:
- id: gearbox-agent
  name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  format: tar.gz
  files:
  - deploy/gearbox-agent.service
  - README.md
  - LICENSE*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^ci:'
    - Merge pull request
    - Merge branch

release:
  github:
    owner: sarg3nt
    name: gearbox-agent
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
