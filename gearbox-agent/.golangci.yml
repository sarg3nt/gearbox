version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (io.ReadCloser).Close
        - (*net/http.Response.Body).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Conn).SetDeadline
        - (io.Writer).Write
        - (*encoding/json.Encoder).Encode
        - (*golang.org/x/crypto/ssh.Session).Close
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        - (*github.com/gorilla/websocket.Conn).SetWriteDeadline
        - (*github.com/gorilla/websocket.Conn).WriteMessage
        - fmt.Sscanf
        - os.Remove
  exclusions:
    presets:
      - comments
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - staticcheck
        text: "SA1019.*io/ioutil"
      - linters:
          - staticcheck
        text: "SA9003"
      - linters:
          - staticcheck
        text: "SA4006"
      - linters:
          - staticcheck
        text: "could apply De Morgan"
      - linters:
          - staticcheck
        text: "could use tagged switch"
      - linters:
          - staticcheck
        text: "should replace loop with"

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true
  sort-order:
    - file
    - linter
