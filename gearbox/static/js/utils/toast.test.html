<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toast Library Tests</title>
<style>
	body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
	.pass { color: #4ade80; }
	.fail { color: #f87171; font-weight: bold; }
	.suite { color: #60a5fa; font-size: 14px; margin-top: 16px; }
	.result { margin-left: 16px; font-size: 13px; }
	#summary { margin-top: 24px; padding: 12px; border-top: 1px solid #444; font-size: 14px; }
</style>
</head>
<body>
<h2>Toast Library — Test Suite</h2>
<div id="output"></div>
<div id="summary"></div>

<!-- Toast container (same as the Templ component renders) -->
<div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col space-y-2 pointer-events-none"></div>

<!-- Load the toast library -->
<script src="toast.js"></script>

<script>
(function () {
	'use strict';

	var out = document.getElementById('output');
	var passed = 0;
	var failed = 0;
	var currentSuite = '';

	function suite(name) {
		currentSuite = name;
		var el = document.createElement('div');
		el.className = 'suite';
		el.textContent = '■ ' + name;
		out.appendChild(el);
	}

	function assert(condition, label) {
		var el = document.createElement('div');
		el.className = 'result';
		if (condition) {
			el.innerHTML = '<span class="pass">✓</span> ' + label;
			passed++;
		} else {
			el.innerHTML = '<span class="fail">✗</span> ' + label;
			failed++;
			console.error('FAIL: [' + currentSuite + '] ' + label);
		}
		out.appendChild(el);
	}

	function assertEqual(actual, expected, label) {
		var ok = actual === expected;
		assert(ok, label + (ok ? '' : ' (expected: ' + JSON.stringify(expected) + ', got: ' + JSON.stringify(actual) + ')'));
	}

	function assertIncludes(str, substr, label) {
		var ok = typeof str === 'string' && str.indexOf(substr) !== -1;
		assert(ok, label + (ok ? '' : ' (expected to include: ' + JSON.stringify(substr) + ', got: ' + JSON.stringify(str) + ')'));
	}

	function cleanup() {
		if (window.dismissAllToasts) window.dismissAllToasts();
		var c = document.getElementById('toast-container');
		// Force-remove any remaining after dismissAll animation
		while (c && c.firstChild) c.removeChild(c.firstChild);
	}

	function showSummary() {
		var el = document.getElementById('summary');
		var total = passed + failed;
		el.innerHTML = '<strong>Results:</strong> ' + passed + '/' + total + ' passed' +
			(failed > 0 ? ', <span class="fail">' + failed + ' failed</span>' : ' <span class="pass">— all green</span>');
	}

	// ── Tests ──────────────────────────────────────────────────────

	// -- 1. Global API exists --
	suite('Global API');
	assert(typeof window.showToast === 'function', 'showToast is a function');
	assert(typeof window.dismissToast === 'function', 'dismissToast is a function');
	assert(typeof window.dismissAllToasts === 'function', 'dismissAllToasts is a function');
	assert(typeof window.toastDefaults === 'object', 'toastDefaults is an object');

	// -- 2. Basic creation --
	suite('Basic Toast Creation');
	cleanup();
	var t1 = showToast('Hello world', 'success', 0);
	assert(t1 !== null && t1 !== undefined, 'showToast returns a DOM element');
	assert(t1 instanceof HTMLElement, 'returned value is an HTMLElement');
	assertEqual(t1.dataset.message, 'Hello world', 'data-message stores the original text');
	assert(t1.dataset.toastId !== undefined, 'toast has a unique ID in data-toast-id');
	assertIncludes(t1.innerHTML, 'Hello world', 'message appears in innerHTML');
	cleanup();

	// -- 3. Type styling --
	suite('Toast Types');
	['success', 'error', 'warning', 'info'].forEach(function (type) {
		cleanup();
		var t = showToast('Test ' + type, type, 0);
		assert(t !== null, type + ' toast is created');
		assertIncludes(t.innerHTML, 'bg-', type + ' toast has background color class');
		cleanup();
	});

	// Default type
	cleanup();
	var tDefault = showToast('Default type', 'unknown', 0);
	assertIncludes(tDefault.innerHTML, 'bg-gray', 'unknown type falls back to gray');
	cleanup();

	// -- 4. HTML escaping --
	suite('HTML Escaping');
	cleanup();
	var tXss = showToast('<script>alert(1)</script>', 'info', 0);
	var msgEl = tXss.querySelector('.toast-message');
	assert(msgEl.textContent.indexOf('<script>') !== -1, 'script tag is visible as text');
	assert(msgEl.innerHTML.indexOf('<script>') === -1, 'script tag is escaped in innerHTML');
	cleanup();

	// -- 5. Close button --
	suite('Close Button');
	cleanup();
	var tClose = showToast('Close me', 'success', 0);
	var closeBtn = tClose.querySelector('.toast-close');
	assert(closeBtn !== null, 'close button exists');
	assertEqual(closeBtn.title, 'Dismiss', 'close button has title "Dismiss"');
	cleanup();

	// -- 6. Copy button --
	suite('Copy Button');
	cleanup();
	var tCopy = showToast('Copy me', 'info', 0);
	var copyBtn = tCopy.querySelector('.toast-copy');
	assert(copyBtn !== null, 'copy button exists');
	assertEqual(copyBtn.title, 'Copy to clipboard', 'copy button has correct title');
	cleanup();

	// -- 7. Stacking --
	suite('Stacking');
	cleanup();
	var t1s = showToast('First', 'success', 0);
	var t2s = showToast('Second', 'info', 0);
	var t3s = showToast('Third', 'warning', 0);
	var container = document.getElementById('toast-container');
	assertEqual(container.children.length, 3, 'three toasts are stacked in the container');
	cleanup();

	// -- 8. Newest on top --
	suite('Newest on Top');
	cleanup();
	var tOld = showToast('Old', 'success', 0);
	var tNew = showToast('New', 'info', 0);
	assertEqual(container.firstChild, tNew, 'newest toast is first child (top)');
	cleanup();

	// -- 9. Max toasts enforcement --
	suite('Max Toasts');
	cleanup();
	var originalMax = window.toastDefaults.maxToasts;
	window.toastDefaults.maxToasts = 3;
	showToast('A', 'success', 0);
	showToast('B', 'success', 0);
	showToast('C', 'success', 0);
	showToast('D', 'success', 0); // should evict the oldest
	// Note: oldest may be in dismiss animation, but only 3 should be non-dismissed
	// After enforceMaxToasts, activeToasts should be at most 3
	// The DOM may temporarily have 4 (animation), but the 4th is _dismissed
	assert(container.children.length <= 4, 'container has at most 4 elements (1 animating out)');
	window.toastDefaults.maxToasts = originalMax;
	cleanup();

	// -- 10. Duration: numeric 3rd argument --
	suite('Duration — Numeric Argument');
	cleanup();
	var tDur = showToast('Timed', 'success', 60000);
	assert(tDur !== null, 'toast created with numeric duration');
	cleanup();

	// -- 11. Duration: options object --
	suite('Duration — Options Object');
	cleanup();
	var tOpts = showToast('Options', 'success', { duration: 60000 });
	assert(tOpts !== null, 'toast created with options object duration');
	cleanup();

	// -- 12. Persistent mode --
	suite('Persistent Mode');
	cleanup();
	var tPersist = showToast('Persistent', 'error', { persistent: true });
	assert(tPersist !== null, 'persistent toast is created');
	// No progress bar on persistent toasts
	var pBar = tPersist.querySelector('.h-1');
	assert(pBar === null, 'persistent toast has no progress bar');
	cleanup();

	// -- 13. Progress bar (when enabled) --
	suite('Progress Bar');
	cleanup();
	var tProg = showToast('With progress', 'success', { duration: 60000, progressBar: true });
	var progBar = tProg.querySelector('.h-1');
	assert(progBar !== null, 'progress bar track element exists');
	var progFill = progBar ? progBar.querySelector('div') : null;
	assert(progFill !== null, 'progress bar fill element exists');
	cleanup();

	// -- 14. Progress bar disabled --
	suite('Progress Bar — Disabled');
	cleanup();
	var tNoProg = showToast('No progress', 'success', { duration: 60000, progressBar: false });
	var noProgBar = tNoProg.querySelector('.h-1');
	assert(noProgBar === null, 'progress bar is absent when progressBar: false');
	cleanup();

	// -- 15. Custom buttons --
	suite('Custom Buttons');
	cleanup();
	var btnClicked = false;
	var tBtns = showToast('With buttons', 'info', {
		persistent: true,
		buttons: [
			{ label: 'Undo', onClick: function () { btnClicked = true; } },
			{ label: 'Details' }
		]
	});
	var customBtns = tBtns.querySelectorAll('button');
	// Should have: 2 custom + 1 copy + 1 close = 4
	assert(customBtns.length >= 4, 'custom buttons are rendered (' + customBtns.length + ' total buttons)');
	// Find the Undo button and click it
	var undoBtn = null;
	for (var i = 0; i < customBtns.length; i++) {
		if (customBtns[i].textContent === 'Undo') { undoBtn = customBtns[i]; break; }
	}
	assert(undoBtn !== null, 'Undo button found by label');
	if (undoBtn) undoBtn.click();
	assert(btnClicked, 'custom button onClick callback fires');
	cleanup();

	// -- 16. Custom button with dismiss: false --
	suite('Custom Button — No Auto-Dismiss');
	cleanup();
	var tNoDismiss = showToast('Stay open', 'info', {
		persistent: true,
		buttons: [{ label: 'Keep', onClick: function () {}, dismiss: false }]
	});
	var keepBtn = null;
	var allBtns = tNoDismiss.querySelectorAll('button');
	for (var j = 0; j < allBtns.length; j++) {
		if (allBtns[j].textContent === 'Keep') { keepBtn = allBtns[j]; break; }
	}
	if (keepBtn) keepBtn.click();
	assert(!tNoDismiss._dismissed, 'toast stays open when button has dismiss: false');
	cleanup();

	// -- 17. onClose callback --
	suite('onClose Callback');
	cleanup();
	var closeCalled = false;
	var tCb = showToast('Callback test', 'success', {
		duration: 0,
		onClose: function () { closeCalled = true; }
	});
	// Manually dismiss and wait for animation
	dismissToast(tCb);
	// The callback fires after animation delay — test synchronously won't catch it,
	// so we verify it was stored
	assert(typeof tCb._onClose === 'function' || closeCalled, 'onClose callback is stored or already fired');
	cleanup();

	// -- 18. dismissToast --
	suite('dismissToast');
	cleanup();
	var tDis = showToast('Dismiss me', 'warning', 0);
	assert(container.children.length >= 1, 'toast exists before dismiss');
	dismissToast(tDis);
	assert(tDis._dismissed === true, 'toast is marked as dismissed');
	cleanup();

	// -- 19. dismissAllToasts --
	suite('dismissAllToasts');
	cleanup();
	showToast('A', 'success', 0);
	showToast('B', 'error', 0);
	showToast('C', 'info', 0);
	dismissAllToasts();
	// All should be marked dismissed
	var allDismissed = true;
	var children = container.children;
	for (var k = 0; k < children.length; k++) {
		if (!children[k]._dismissed) allDismissed = false;
	}
	assert(allDismissed, 'all toasts are marked as dismissed after dismissAllToasts');
	cleanup();

	// -- 20. Type-specific default durations --
	suite('Type-Specific Default Durations');
	var durations = window.toastDefaults.durations;
	assertEqual(durations.success, 5000, 'success default is 5000ms');
	assertEqual(durations.error, 8000, 'error default is 8000ms');
	assertEqual(durations.warning, 6000, 'warning default is 6000ms');
	assertEqual(durations.info, 5000, 'info default is 5000ms');

	// -- 21. Drag-to-dismiss setup --
	suite('Drag-to-Dismiss');
	cleanup();
	var tDrag = showToast('Drag me', 'info', { persistent: true, dragDismiss: true });
	assertEqual(tDrag.style.touchAction, 'pan-y', 'touchAction is set to pan-y for drag');
	assertEqual(tDrag.style.cursor, 'grab', 'cursor is set to grab for drag');
	cleanup();

	// -- 22. Drag disabled --
	suite('Drag-to-Dismiss — Disabled');
	cleanup();
	var tNoDrag = showToast('No drag', 'info', { persistent: true, dragDismiss: false });
	assert(tNoDrag.style.touchAction !== 'pan-y', 'touchAction not set when drag disabled');
	cleanup();

	// -- 23. Null container --
	suite('Missing Container');
	var c = document.getElementById('toast-container');
	c.id = 'toast-container-hidden';
	var tNull = showToast('No container', 'info');
	assert(tNull === null, 'returns null when container is missing');
	c.id = 'toast-container';

	// -- 24. Backward compatibility: no 3rd argument --
	suite('Backward Compatibility');
	cleanup();
	var tCompat1 = showToast('Compat test', 'success');
	assert(tCompat1 !== null, 'works with just message + type (no duration)');
	cleanup();

	// Just message
	cleanup();
	var tCompat2 = showToast('Just message');
	assert(tCompat2 !== null, 'works with just message (defaults to success)');
	cleanup();

	// -- 25. ToastOnLoad processing --
	suite('ToastOnLoad Processing');
	// The DOMContentLoaded handler already ran, so we test that future elements
	// with toast-on-load class would be picked up by verifying the code path exists
	assert(true, 'DOMContentLoaded handler registered (runs at page load)');

	// -- 26. Double-dismiss safety --
	suite('Double Dismiss Safety');
	cleanup();
	var tDouble = showToast('Double', 'success', 0);
	dismissToast(tDouble);
	dismissToast(tDouble); // should not throw
	assert(true, 'double dismiss does not throw');
	cleanup();

	// -- 27. toastDefaults is mutable --
	suite('Mutable Defaults');
	var origDur = window.toastDefaults.durations.success;
	window.toastDefaults.durations.success = 1234;
	assertEqual(window.toastDefaults.durations.success, 1234, 'defaults can be changed at runtime');
	window.toastDefaults.durations.success = origDur;

	// -- 28. Unique IDs --
	suite('Unique Toast IDs');
	cleanup();
	var ta = showToast('A', 'success', 0);
	var tb = showToast('B', 'success', 0);
	assert(ta.dataset.toastId !== tb.dataset.toastId, 'each toast gets a unique ID');
	cleanup();

	// -- 29. Animation classes --
	suite('Animation Classes');
	cleanup();
	var tAnim = showToast('Animate', 'success', 0);
	assertIncludes(tAnim.className, 'transition-all', 'toast has transition-all class');
	assertIncludes(tAnim.className, 'duration-300', 'toast has duration-300 class');
	cleanup();

	// -- 30. Inner structure --
	suite('DOM Structure');
	cleanup();
	var tStruct = showToast('Structure test', 'success', { persistent: true });
	assert(tStruct.querySelector('.toast-message') !== null, 'has .toast-message element');
	assert(tStruct.querySelector('.toast-copy') !== null, 'has .toast-copy button');
	assert(tStruct.querySelector('.toast-close') !== null, 'has .toast-close button');
	assert(tStruct.querySelector('svg') !== null, 'has SVG icon');
	// Check overflow hidden for progress bar clipping
	assertIncludes(tStruct.querySelector('div').className, 'overflow-hidden', 'inner div has overflow-hidden');
	cleanup();

	// ── Summary ────────────────────────────────────────────────────
	showSummary();
})();
</script>
</body>
</html>
