# Dependabot version updates configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
# Go modules for HAProxy monitoring application
- package-ecosystem: "gomod"
  directory: "/gearbox"
  schedule:
    interval: "monthly"
    time: "09:00"
  open-pull-requests-limit: 5
  labels:
  - "dependencies"
  - "go"
  commit-message:
    prefix: "chore(deps)"
    include: "scope"
  groups:
    go-dependencies:
      patterns:
      - "*"

# GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
    time: "09:00"
  open-pull-requests-limit: 5
  labels:
  - "dependencies"
  - "github-actions"
  commit-message:
    prefix: "chore(deps)"
    include: "scope"
  groups:
    github-actions:
      patterns:
      - "*"

# Docker base images
- package-ecosystem: "docker"
  directory: "/gearbox"
  schedule:
    interval: "monthly"
    time: "09:00"
  open-pull-requests-limit: 3
  labels:
  - "dependencies"
  - "docker"
  commit-message:
    prefix: "chore(deps)"
    include: "scope"
  groups:
    docker-images:
      patterns:
      - "*"
